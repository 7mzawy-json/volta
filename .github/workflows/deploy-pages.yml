name: Deploy to GitHub Pages

# GitHub Pages serves this project repo from /volta/, so the build needs
# VITE_BASE — without it every asset URL points at the domain root and the page
# renders blank. The origin is set here too because .env is gitignored and the
# runner never sees it; without it the prerender step warns and leaves og:url
# relative rather than baking in a wrong host.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead of cancelling, so a push that
# follows a push still ends with the newer build live.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The unit suite only. The accessibility suite drives a real Chrome and is
      # left to run locally — see README. If it is ever added here it needs
      # `npx playwright install --with-deps chromium` and PLAYWRIGHT_CHANNEL
      # unset, because the runner has no `chrome` channel.
      - run: npm test

      - run: npm run build
        env:
          VITE_BASE: /volta/
          VITE_SITE_ORIGIN: https://7mzawy-json.github.io

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
